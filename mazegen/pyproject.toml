[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable perfect and Pac-Man style maze generator."
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = ["mazegen"]
package-dir = { "mazegen" = "." }

[tool.setuptools.package-data]
mazegen = ["py.typed"]
